<!DOCTYPE html>
<!-- 툴바 아이콘을 눌렀을 때 뜨는 작은 패널.
     아이콘을 눌러도 아무 일이 없으면 "안 되는 확장"으로 보여서 만들었다.
     문구는 i18n-options.js 의 OPT_I18N("pop.*" 키)에서 온다 — 설정 페이지와 같은 표를 쓴다. -->
<html>
<head>
  <meta charset="utf-8">
  <title>TapTap - Quick Search</title>
  <link rel="stylesheet" href="accent.css"/>
  <script src="accent.js"></script>
  <style>
    :root{
      --bg:#fff; --fg:#1f2430; --muted:#6b7280; --line:#e5e7eb;
      --softBg:#f6f7f9;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#1e2128; --fg:#e8eaed; --muted:#9aa0a6; --line:#343a44;
        --softBg:#262a32;
      }
    }
    *{box-sizing:border-box}
    body{
      margin:0; width:300px; background:var(--bg); color:var(--fg);
      font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    }
    .wrap{padding:14px}
    .head{display:flex; align-items:center; gap:8px; margin-bottom:10px}
    .head img{width:28px; height:28px; border-radius:6px}
    .name{font-size:14px; font-weight:700; letter-spacing:-.01em}
    .tagline{color:var(--muted); margin:0 0 12px; font-size:12.5px}
    .tagline kbd{
      display:inline-block; padding:1px 5px; border:1px solid var(--line);
      border-bottom-width:2px; border-radius:4px; background:var(--softBg);
      font:inherit; font-size:11.5px; font-weight:600;
    }
    button{
      width:100%; padding:9px 12px; border-radius:8px; font:inherit; font-weight:600;
      cursor:pointer; border:1px solid transparent;
    }
    .primary{background:var(--accent); color:var(--on-accent)}
    .primary:hover{filter:brightness(1.08)}
    .ghost{background:transparent; color:var(--fg); border-color:var(--line); margin-top:7px; font-weight:500}
    .ghost:hover{background:var(--softBg)}
    .msg{
      display:none; margin-top:9px; padding:8px 10px; border-radius:7px;
      background:var(--softBg); color:var(--muted); font-size:12px;
    }
    .msg.show{display:block}
    .foot{
      margin-top:12px; padding-top:10px; border-top:1px solid var(--line);
      color:var(--muted); font-size:11.5px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <img src="icons/icon48.png" alt="">
      <div class="name">TapTap - Quick Search</div>
    </div>

    <p class="tagline" id="tagline" data-i18n-html="pop.tagline"></p>

    <button type="button" class="primary" id="openBtn" data-i18n="pop.openBtn"></button>
    <button type="button" class="ghost" id="notesBtn" data-i18n="pop.notesBtn"></button>
    <button type="button" class="ghost" id="optBtn" data-i18n="pop.settingsBtn"></button>

    <div class="msg" id="msg" data-i18n="pop.failed"></div>

    <div class="foot" id="foot" data-i18n="pop.hint"></div>
  </div>

  <script src="i18n-options.js"></script>
  <script src="popup.js"></script>
</body>
</html>
