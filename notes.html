<!doctype html>
<!-- 노트 페이지. 팝업의 [노트] 로 저장한 조각과 메모를 보고 고친다.
     색 토큰·사이드바는 options.html 과 같은 모양 — 두 페이지를 오가도 한 앱처럼 보여야 한다.
     저장소는 notes-db.js (IndexedDB), 문구는 i18n-options.js 의 "n.*" 키. -->
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>TapTap — Notes</title>
  <link rel="stylesheet" href="accent.css"/>
  <script src="accent.js"></script>
  <style>
    :root {
      --bg:#F8F9FB; --card:#FFFFFF; --border:#E5E7EB; --text:#111827; --muted:#6B7280;
      --danger:#EF4444; --danger-soft:#FEF2F2;
      --radius:14px; --radius-sm:9px;
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#0D1117; --card:#161B22; --border:#30363D;
        --text:#E6EDF3; --muted:#8B949E;
        --danger:#F87171; --danger-soft:#2D1B1B;
      }
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
      background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
      height:100vh;overflow:hidden;
    }
    button{font:inherit;color:inherit}
    .layout{display:flex;height:100vh}
    svg.ic{width:15px;height:15px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    /* ── Sidebar (options.html 과 같은 모양) ── */
    .sidebar{
      width:230px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);
      padding:20px 12px 14px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;
    }
    .sideTitle{display:flex;align-items:baseline;gap:5px;padding:4px 10px 10px;white-space:nowrap;user-select:none}
    .sideTitle .bolt{color:#F5B301;align-self:center;display:flex}
    .sideTitle .bolt svg{display:block;width:15px;height:15px}
    .sideTitle .brand{font-size:15px;font-weight:800;letter-spacing:-.02em}
    .sideTitle .brandSub{font-size:11px;font-weight:500;color:var(--muted)}
    .navItem{
      display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
      color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;user-select:none;
      text-decoration:none;transition:all .13s;
    }
    .navItem:hover{background:rgba(var(--accent-rgb),.07);color:var(--accent)}
    .navItem.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
    .navItem .navIcon{font-size:17px;flex-shrink:0}

    /* 폴더 */
    .secLabel{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
    .folder{
      display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-radius:8px;
      font-size:13px;cursor:pointer;user-select:none;border:1.5px solid transparent;
    }
    .folder:hover{background:var(--bg)}
    .folder.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
    .folder.dropOver{border-color:var(--accent);background:var(--accent-soft)}
    .folder .fIcon{flex:none;width:18px;text-align:center}
    .folder .fName{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .folder .fCount{font-size:11.5px;color:var(--muted);font-weight:500}
    .folder .fTarget{font-size:11px}
    .folder .fAct{display:none;border:none;background:none;cursor:pointer;color:var(--muted);padding:2px;border-radius:5px}
    .folder:hover .fAct{display:block}
    .folder:hover .fCount{display:none}
    .folder .fAct:hover{color:var(--text);background:var(--card)}
    .folder .fAct.del:hover{color:var(--danger)}
    .folder input{flex:1;min-width:0;font:inherit;font-size:13px;padding:2px 6px;border:1px solid var(--accent);
      border-radius:6px;background:var(--card);color:var(--text);outline:none}
    .newFolder{color:var(--muted)}
    .newFolder:hover{color:var(--accent)}

    .sideFoot{margin-top:auto;padding:12px 8px 0;display:flex;flex-direction:column;gap:9px;font-size:11.5px;color:var(--muted);line-height:1.55}
    .sideFoot label{display:flex;gap:7px;align-items:flex-start;cursor:pointer;color:var(--text);font-size:12px}
    .sideFoot input[type=checkbox]{margin-top:3px;accent-color:var(--accent)}
    .targetLine b{color:var(--text);font-weight:600}
    .backupRow{display:flex;gap:6px}
    .backupBtn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:5px 6px;
      border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
    .backupBtn:hover{border-color:var(--accent);color:var(--accent)}
    .backupBtn svg.ic{width:13px;height:13px}
    .backupLine{margin-top:-4px}
    .backupLine.warn{color:#D97706}
    .localOnly{font-size:11px;opacity:.85}

    /* ── 컬럼 폭 손잡이 (사이드바|목록, 목록|편집). 테두리 위에 겹쳐 놓는다. 더블클릭 = 기본 폭 ── */
    .resizer{flex:none;width:7px;margin:0 -3px 0 -4px;cursor:col-resize;position:relative;z-index:5;touch-action:none}
    .resizer::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:transparent;transition:background .12s}
    .resizer:hover::after,.resizer.dragging::after{background:var(--accent);width:2px;left:2.5px}
    body.colResizing{cursor:col-resize;user-select:none}
    body.colResizing iframe,body.colResizing .doc{pointer-events:none}

    /* ── 목록 ── */
    .listCol{width:310px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg)}
    .listHead{padding:18px 14px 10px}
    .listTitle{font-size:18px;font-weight:700;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;min-width:0}
    .listTitle #listName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .listCount{font-size:12px;font-weight:500;color:var(--muted);flex:none}
    .searchBox{
      width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);
      background:var(--card);color:var(--text);font:inherit;font-size:13px;outline:none;
    }
    .searchBox:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .bulkRow{display:flex;gap:6px;margin-top:8px}
    .bulkBtn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 8px;
      border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
    .bulkBtn:hover{border-color:var(--accent);color:var(--accent)}
    .list{flex:1;overflow-y:auto;padding:4px 8px 16px}
    .item{
      position:relative;display:block;width:100%;text-align:left;border:1px solid transparent;background:none;
      padding:10px 34px 10px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;
    }
    .item:hover{background:var(--card);border-color:var(--border)}
    .item.active{background:var(--accent-soft);border-color:var(--accent)}
    .item.dragging{opacity:.45}
    .itemTitle{font-size:13px;font-weight:600;line-height:1.4;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .itemMeta{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .itemSnip{font-size:12px;color:var(--muted);margin-top:3px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .itemDel{
      position:absolute;top:8px;right:6px;width:24px;height:24px;display:none;align-items:center;justify-content:center;
      border:none;border-radius:6px;background:none;color:var(--muted);cursor:pointer;
    }
    .item:hover .itemDel{display:flex}
    .itemDel:hover{color:var(--danger);background:var(--danger-soft)}
    .itemDel svg.ic{width:14px;height:14px}
    .listEmpty{padding:24px 12px;font-size:13px;color:var(--muted);line-height:1.6}
    .listEmpty kbd, .emptyPane kbd{
      display:inline-block;padding:0 6px;border:1px solid var(--border);border-bottom-width:2px;
      border-radius:4px;background:var(--card);font:inherit;font-size:12px;font-weight:600;
    }

    /* ── 편집 영역 ── */
    .editCol{flex:1;min-width:0;display:flex;flex-direction:column}
    .emptyPane{margin:auto;text-align:center;color:var(--muted);font-size:14px;line-height:1.7;padding:24px}
    .emptyPane .big{font-size:40px;margin-bottom:8px}
    .editor{display:none;flex:1;min-height:0;flex-direction:column}
    .editor.show{display:flex}
    .edHead{padding:18px 28px 12px;border-bottom:1px solid var(--border);background:var(--card)}
    .titleInput{
      width:100%;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);
      font:inherit;font-size:19px;font-weight:700;padding:4px 8px;margin-left:-8px;outline:none;
    }
    .titleInput:hover{border-color:var(--border)}
    .titleInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .metaRow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--muted)}
    .metaRow a{color:var(--accent);text-decoration:none;max-width:480px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
    .metaRow a:hover{text-decoration:underline}
    .folderSel{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--text)}
    .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:12px}
    .tb{
      min-width:30px;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:7px;
      background:var(--card);font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
    }
    .tb:hover{border-color:var(--accent);color:var(--accent)}
    .tbSep{width:1px;height:20px;background:var(--border);margin:0 4px}
    .tbGrow{flex:1}
    .saveState{font-size:12px;color:var(--muted);margin-right:6px}
    .tb.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
    .edBody{flex:1;overflow-y:auto;padding:22px 28px 60px}
    /* 본문 — 저장된 HTML 은 class/style 이 없으니 여기서 읽기 좋게 */
    .doc{max-width:760px;outline:none;font-size:15px;line-height:1.75;word-wrap:break-word;min-height:200px}
    .doc > *:first-child{margin-top:0}
    .doc p,.doc ul,.doc ol,.doc blockquote,.doc pre,.doc table,.doc figure{margin:0 0 .9em}
    .doc h1,.doc h2,.doc h3,.doc h4{line-height:1.35;margin:1.2em 0 .5em}
    .doc h1{font-size:1.6em}.doc h2{font-size:1.35em}.doc h3{font-size:1.15em}
    .doc ul,.doc ol{padding-left:1.5em}
    .doc img{max-width:100%;height:auto;border-radius:6px}
    .doc a{color:var(--accent)}
    .doc blockquote{border-left:3px solid var(--border);padding-left:14px;color:var(--muted)}
    .doc pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;font-size:13px}
    .doc code{font-family:ui-monospace,Consolas,monospace;font-size:.9em}
    .doc table{border-collapse:collapse}
    .doc td,.doc th{border:1px solid var(--border);padding:5px 9px;vertical-align:top}
    .doc hr{border:none;border-top:1px dashed var(--border);margin:1.4em 0}

    /* ── 알림 (삭제 되돌리기 · 복사됨) ── */
    .toast{
      position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
      display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:10px;
      background:#111827;color:#F9FAFB;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:all .18s;
    }
    .toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
    .toast button{border:none;background:none;color:color-mix(in srgb,var(--accent) 45%,#fff);font-weight:700;cursor:pointer;padding:0}

    @media (max-width:980px){
      .sidebar{width:190px}
      .listCol{width:250px}
      .sideTitle .brandSub{display:none}
    }
  </style>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="sideTitle">
      <span class="bolt"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.615 1.595a.75.75 0 0 1 .359.852L12.982 9.75h7.268a.75.75 0 0 1 .548 1.262l-10.5 11.25a.75.75 0 0 1-1.272-.71l1.992-7.302H3.75a.75.75 0 0 1-.548-1.262l10.5-11.25a.75.75 0 0 1 .913-.143Z"/></svg></span>
      <span class="brand">TapTap</span><span class="brandSub">- Quick Search</span>
    </div>
    <a class="navItem active" href="notes.html"><span class="navIcon">📒</span><span data-i18n="nav.notes">Notes</span></a>
    <a class="navItem" href="options.html"><span class="navIcon">⚙️</span><span data-i18n="nav.settings">Settings</span></a>

    <div class="secLabel" data-i18n="n.folders">Folders</div>
    <div id="folderList"></div>
    <div class="folder newFolder" id="newFolderBtn"><span class="fIcon">＋</span><span class="fName" data-i18n="n.newFolder">New folder</span></div>

    <div class="sideFoot">
      <div class="targetLine" id="targetLine"></div>
      <label><input type="checkbox" id="appendOpt"/><span data-i18n="n.appendOpt"></span></label>
      <div id="usageLine"></div>
      <div class="backupRow">
        <button class="backupBtn" id="backupBtn" data-i18n-title="n.backupTip"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-i18n="n.backup"></span></button>
        <button class="backupBtn" id="restoreBtn" data-i18n-title="n.restoreTip"><svg class="ic" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg><span data-i18n="n.restore"></span></button>
      </div>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden/>
      <div class="backupLine" id="backupLine"></div>
      <div class="localOnly" data-i18n="n.localOnly"></div>
    </div>
  </nav>
  <div class="resizer" data-col="sidebar"></div>

  <section class="listCol">
    <div class="listHead">
      <div class="listTitle"><span id="listName"></span><span class="listCount" id="listCount"></span></div>
      <input class="searchBox" id="searchBox" type="search" data-i18n-ph="n.search"/>
      <div class="bulkRow">
        <button class="bulkBtn" id="bulkCopyBtn" data-i18n-title="n.copyAllTip"><svg class="ic" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span data-i18n="n.copyAll"></span></button>
        <button class="bulkBtn" id="bulkExportBtn" data-i18n-title="n.exportAllTip"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>.md</span></button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>
  <div class="resizer" data-col="list"></div>

  <main class="editCol">
    <div class="emptyPane" id="emptyPane">
      <div class="big">📒</div>
      <div id="emptyText"></div>
    </div>

    <div class="editor" id="editor">
      <div class="edHead">
        <input class="titleInput" id="titleInput" maxlength="300"/>
        <div class="metaRow">
          <span>🔗 <a id="srcLink" target="_blank" rel="noopener noreferrer"></a></span>
          <span id="dateInfo"></span>
          <span>📂 <select class="folderSel" id="folderSel"></select></span>
        </div>
        <div class="toolbar">
          <button class="tb" data-cmd="bold" data-i18n-title="n.bold"><b>B</b></button>
          <button class="tb" data-cmd="italic" data-i18n-title="n.italic"><i>I</i></button>
          <span class="tbSep"></span>
          <button class="tb" data-cmd="insertUnorderedList" data-i18n-title="n.ul">•≡</button>
          <button class="tb" data-cmd="insertOrderedList" data-i18n-title="n.ol">1≡</button>
          <button class="tb" data-cmd="formatBlock" data-arg="blockquote" data-i18n-title="n.quote">❝</button>
          <button class="tb" data-cmd="removeFormat" data-i18n-title="n.clear">T̸</button>
          <span class="tbGrow"></span>
          <span class="saveState" id="saveState"></span>
          <button class="tb" id="copyMdBtn" data-i18n-title="n.copyMdTip"><svg class="ic" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span data-i18n="n.copyMd"></span></button>
          <button class="tb" id="exportMdBtn" data-i18n-title="n.exportMdTip"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>.md</button>
          <button class="tb" id="exportBtn" data-i18n-title="n.exportTip"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>.html</button>
          <button class="tb danger" id="deleteBtn" data-i18n-title="n.delete"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        </div>
      </div>
      <div class="edBody">
        <div class="doc" id="doc" contenteditable="true" spellcheck="false"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>

<script src="i18n-options.js"></script>
<script src="notes-db.js"></script>
<script src="notes.js"></script>
</body>
</html>
